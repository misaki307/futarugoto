<!doctype html>
<html lang="ja" data-theme="classic">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>ふたりごと</title>
<meta name="theme-color" content="#0058A3" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="ふたりごと" />
<link rel="manifest" href="manifest.json" />
<link rel="apple-touch-icon" href="icons/icon-180.png" />
<link rel="icon" href="icons/icon-192.png" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&display=swap" />
<link rel="stylesheet" href="css/tokens.css" />
<link rel="stylesheet" href="css/base.css" />
<link rel="stylesheet" href="css/components.css" />
</head>
<body>
<div id="app">
  <main id="view-root" class="view-root" aria-live="polite"></main>

  <nav class="tab-bar" aria-label="画面切り替え">
    <button class="tab-bar__item" data-view="home" aria-current="page">
      <span class="tab-bar__icon" aria-hidden="true">🏠</span>
      <span class="tab-bar__label">ホーム</span>
    </button>
    <button class="tab-bar__item" data-view="timeline">
      <span class="tab-bar__icon-wrap">
        <span class="tab-bar__icon" aria-hidden="true">💬</span>
        <span class="tab-bar__badge" id="tab-badge-timeline" hidden></span>
      </span>
      <span class="tab-bar__label">タイムライン</span>
    </button>
    <button class="tab-bar__item" data-view="lists">
      <span class="tab-bar__icon" aria-hidden="true">📝</span>
      <span class="tab-bar__label">リスト</span>
    </button>
    <button class="tab-bar__item" data-view="calendar">
      <span class="tab-bar__icon" aria-hidden="true">📅</span>
      <span class="tab-bar__label">カレンダー</span>
    </button>
    <button class="tab-bar__item" data-view="photos">
      <span class="tab-bar__icon" aria-hidden="true">🖼️</span>
      <span class="tab-bar__label">写真</span>
    </button>
    <button class="tab-bar__item" data-view="settings">
      <span class="tab-bar__icon" aria-hidden="true">⚙️</span>
      <span class="tab-bar__label">設定</span>
    </button>
  </nav>

  <div id="toast" class="toast" role="status"></div>
</div>

<script type="module" src="js/app.js"></script>
</body>
</html>
